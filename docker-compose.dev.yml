services:
  wg-easy:
    build:
      dockerfile: ./Dockerfile.dev
    command: dev
    tmpfs:
      - /app/.nuxt
    volumes:
      - /lib/modules:/lib/modules:ro
      # - ./data/:/etc/wireguard
    ports:
      # shifted and bound to localhost so a production wg-easy can keep running
      # on the same host during development
      - "127.0.0.1:51830:51820/udp"
      - "127.0.0.1:51831:51821/tcp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - INIT_ENABLED=true
      - INIT_HOST=test
      - INIT_PORT=51820
      - INIT_USERNAME=testtest
      - INIT_PASSWORD=Qweasdyxcv!2

    develop:
      watch:
        - action: sync
          path: ./src
          target: /app
          initial_sync: true
          ignore:
            - node_modules/
            - .nuxt/
            - .output/
            - coverage/
            - package.json
            - pnpm-lock.yaml
            - pnpm-workspace.yaml
